name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: devcontainers/ci@v0.3
        with:
          configFile: .github/ci/devcontainer.json
          runCmd: |
            set -euo pipefail
            id
            getent passwd "$(id -un)"
            stat -c '%u %g %a %n' "$PWD" "$(dirname "$PWD")" /
            cargo fmt --all -- --check
            cargo clippy --locked --workspace --all-targets -- -D warnings
            cargo test --locked --workspace 2>&1 | tee target/test.log
            .github/ci/check-tests-ran.sh target/test.log
            stat -c '%u %g %a %n' target target/tmp
