[package]
name = "providers"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1"
identity-core = { path = "../../../crates/identity-core" }
inventory = { path = "../inventory" }
oo7 = "0.7.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde_json = "1.0.154"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["process", "rt", "time"] }
url = "2.5.8"

[dev-dependencies]
test-support = { path = "../test-support" }
tokio = { version = "1", features = ["macros", "process", "rt", "rt-multi-thread", "time"] }
wiremock = "0.6.5"
zbus = { version = "6", default-features = false, features = ["p2p", "tokio"] }
